name: "PR"

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-go:
    name: Run Go Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/checkout@v3
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pinned rather than "latest": v2 dropped the default exclusion
          # presets, so an unpinned upgrade silently changes what fails.
          version: v2.13.2
          working-directory: src/server/

  test-go:
    name: Run Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: '1.26'
      - uses: actions/checkout@v3
      - name: go build
        working-directory: src/server/
        run: go build ./...
      - name: go test
        working-directory: src/server/
        run: go test -race ./...

  # Unit tests and linting cannot see the seams between Cadence and the services
  # it does not control. Every regression that shipped in the 5.4 images lived
  # exactly there: a renamed status field crash-looped the server, and a renamed
  # Liquidsoap telnet command dropped every song request while the API still
  # answered 202. This job runs the real stack and asserts the round trips that
  # would have caught them.
  smoke-stack:
    name: Run Stack Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate a test music library
        run: |
          mkdir -p /tmp/music
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          gen() {
            ffmpeg -loglevel error -f lavfi -i "sine=frequency=$4:duration=30" \
              -metadata title="$1" -metadata artist="$2" -metadata album="$3" \
              -id3v2_version 3 "/tmp/music/$5" -y
          }
          gen "Midnight Signal" "The Antennas" "Night Transmissions" 440 track1.mp3
          gen "Copper Wire"     "The Antennas" "Night Transmissions" 523 track2.mp3
          gen "Slow Orbit"      "Vega Drift"   "Perihelion"          659 track3.mp3

      - name: Generate configuration
        run: |
          set -eu
          PASS=smoketest
          sed -e "s|CADENCE_PATH_EXAMPLE|/tmp/music|g" \
              -e "s|CADENCE_RATE_EXAMPLE|0|g" \
              -e "s|CADENCE_PASS_EXAMPLE|$PASS|g" \
              config/cadence.env.example > config/cadence.env
          sed -e "s|CADENCE_PATH_EXAMPLE|/tmp/music|g" \
              -e "s|CADENCE_PASS_EXAMPLE|$PASS|g" \
              config/liquidsoap.liq.example > config/liquidsoap.liq
          sed -e "s|CADENCE_PATH_EXAMPLE|/tmp/music|g" \
              -e "s|NGINX_CONFIG_SECTION||g" \
              docker-compose.yml.example > docker-compose.yml

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the server to report ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf -m 3 http://localhost:8080/ready > /dev/null; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server never became ready"
          docker compose logs --no-color
          exit 1

      - name: Assert the library populated and search works
        run: |
          set -eu
          results=$(curl -sf -m 10 -X POST -H 'Content-Type: application/json' \
            -d '{"search":"Antennas"}' http://localhost:8080/api/search)
          echo "$results"
          echo "$results" | grep -q "Midnight Signal"

      - name: Assert source metadata reaches the API
        # The source sends title and artist on their own connection. If that
        # path breaks, the site shows a blank now-playing while audio keeps
        # playing, which is exactly how the Icecast round trip used to fail.
        run: |
          set -eu
          for i in $(seq 1 60); do
            body=$(curl -sf -m 5 http://localhost:8080/api/nowplaying/metadata || true)
            case "$body" in
              *'"Artist":"'*) : ;;
              *) sleep 2; continue ;;
            esac
            if [ "$(printf '%s' "$body" | grep -c '"Artist":""')" = "0" ]; then
              echo "$body"; exit 0
            fi
            sleep 2
          done
          echo "never saw a populated now-playing artist"
          docker compose logs --no-color cadence liquidsoap
          exit 1

      - name: Assert a song request reaches Liquidsoap
        # Guards the telnet-rename class of failure: the API answered 202 while
        # every request was rejected by the audio source and silently dropped.
        run: |
          set -eu
          id=$(curl -sf -m 10 -X POST -H 'Content-Type: application/json' \
            -d '{"search":""}' http://localhost:8080/api/search \
            | sed -n 's/.*"ID":\([0-9]*\).*/\1/p' | head -1)
          echo "requesting song id $id"
          code=$(curl -s -m 15 -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d "{\"ID\":\"$id\"}" \
            http://localhost:8080/api/request/id)
          [ "$code" = "202" ] || { echo "request returned $code"; exit 1; }
          # A 202 alone proves nothing: the failure being guarded against
          # returned 202 too. Liquidsoap logging an error is the real signal.
          sleep 5
          if docker compose logs --no-color cadence | grep -i "unknown command"; then
            echo "the audio source rejected the request command"
            exit 1
          fi

      - name: Assert the audio stream is served same-origin and playable
        # Guards two things at once: that the mount is a format every browser
        # can decode -- Safari and iOS cannot play Ogg, which kept the stream
        # unplayable on Apple devices -- and that it is reachable from the
        # site's own origin rather than a second host on a guessed scheme.
        run: |
          set -eu
          path=$(curl -sf -m 5 http://localhost:8080/api/listenurl | sed -n 's/.*"ListenURL":"\([^"]*\)".*/\1/p')
          echo "listen path: $path"
          case "$path" in
            /stream/*) : ;;
            *) echo "expected a same-origin /stream/ path"; exit 1 ;;
          esac
          type=$(curl -s -m 8 -o /tmp/stream.bin -w '%{content_type}' "http://localhost:8080$path" || true)
          echo "content type: $type"
          [ "$type" = "audio/mpeg" ] || { echo "stream is not MP3"; exit 1; }
          [ -s /tmp/stream.bin ] || { echo "no audio came through"; exit 1; }

      - name: Assert the stream fans out to concurrent listeners
        # Cadence serves the audio itself now, so one listener working proves
        # less than it used to: the failure that matters is a second listener
        # stalling the first, or the source.
        run: |
          set -eu
          path=$(curl -sf -m 5 http://localhost:8080/api/listenurl | sed -n 's/.*"ListenURL":"\([^"]*\)".*/\1/p')
          timeout 6 curl -s -o /tmp/a.bin "http://localhost:8080$path" &
          timeout 6 curl -s -o /tmp/b.bin "http://localhost:8080$path" &
          sleep 3
          curl -sf -m 5 http://localhost:8080/api/listeners
          wait || true
          a=$(stat -c%s /tmp/a.bin); b=$(stat -c%s /tmp/b.bin)
          echo "listener bytes: $a and $b"
          [ "$a" -gt 20000 ] && [ "$b" -gt 20000 ] || { echo "a listener received too little audio"; exit 1; }

      - name: Assert the event stream sends keepalives
        # Guards the frozen-metadata failure: without traffic on an idle
        # connection, a dropped stream is indistinguishable from a quiet one.
        run: |
          set -eu
          timeout 25 curl -sN http://localhost:8080/api/radiodata/sse > /tmp/sse.txt || true
          cat /tmp/sse.txt
          grep -q "keepalive" /tmp/sse.txt

      - name: Assert the server did not panic
        run: |
          if docker compose logs --no-color cadence | grep -i "panic:"; then
            echo "the server panicked"
            exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
