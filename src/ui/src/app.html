<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<title>Cadence | Open-Source Self Hosted Web Radio</title>
		<meta name="description" content="Start a web radio website in minutes." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://cadenceradio.com/" />
		<meta property="og:title" content="Cadence | Open-Source Self Hosted Web Radio" />
		<meta property="og:description" content="Start a web radio website in minutes." />
		<meta property="og:image" content="/splash.jpg" />
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://cadenceradio.com/" />
		<meta property="twitter:title" content="Cadence | Open-Source Self Hosted Web Radio" />
		<meta property="twitter:description" content="Start a web radio website in minutes." />
		<meta property="twitter:image" content="/splash.jpg" />

		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Rock+Salt&family=Archivo+Narrow:wght@400;500;600&family=Chivo+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Applied before first paint so a stored theme does not flash the
			// default one first.
			try {
				var t = localStorage.getItem('themeKey');
				if (t) document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-surface font-display text-ink antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
